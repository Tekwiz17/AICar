name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  behavior:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements-dev.txt
      - run: PYTHONPATH=python python -m unittest discover -s tests -v
      - run: python -m compileall -q python scripts
      - run: g++ -std=c++17 tests/safety_test.cpp -o /tmp/safety && /tmp/safety
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - run: arduino-cli core update-index --additional-urls https://downloads.arduino.cc/packages/package_zephyr_index.json
      - run: arduino-cli compile sketch
